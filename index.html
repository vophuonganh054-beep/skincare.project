    <script>
      (function() {
        try {
          var saved = localStorage.getItem('alps_font_preset');
          // Mặc định chuẩn xác là font trong ảnh: Lora & Be Vietnam Pro ('alps_luxury')
          var active = (!saved || saved === 'playfair' || saved === 'parisian' || saved === 'parisian_editorial' || saved === 'default') ? 'alps_luxury' : saved;
          localStorage.setItem('alps_font_preset', active);
          document.documentElement.setAttribute('data-font', active);
        } catch (e) {
          document.documentElement.setAttribute('data-font', 'alps_luxury');
        }
      })();
    </script>
