<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="640" height="440" fill="none">
  <!-- Minimalist Sharp Alps Peaks -->
  <!-- 1. Đỉnh núi vàng kim nhọn & thanh mảnh phía sau -->
  <g stroke="#c5a059" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="10" opacity="0.9">
    <path d="M26 48 L42 22 L56 48" />
    <path d="M42 22 L47 48" stroke-width="0.8" opacity="0.75" />
    <path d="M104 48 L118 22 L134 48" />
    <path d="M118 22 L113 48" stroke-width="0.8" opacity="0.75" />
  </g>

  <!-- 2. Đỉnh phụ nhọn bên trái -->
  <path
    d="M30 48 L48 20 L64 48"
    stroke="#1c1c19"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="miter"
    stroke-miterlimit="10"
  />

  <!-- 3. Đỉnh phụ nhọn bên phải -->
  <path
    d="M96 48 L112 20 L130 48"
    stroke="#1c1c19"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="miter"
    stroke-miterlimit="10"
  />

  <!-- 4. Đỉnh núi chính trung tâm vút cao kiêu hãnh (Nhọn & sắc bén) -->
  <path
    d="M54 48 L80 8 L106 48"
    stroke="#1c1c19"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="miter"
    stroke-miterlimit="10"
  />

  <!-- 5. Sống núi sắc sảo -->
  <path
    d="M80 8 L78 23 L82 35 L80 48"
    stroke="#1c1c19"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 6. Đường chân núi ngang sắc nét và tối giản -->
  <line
    x1="20"
    y1="48"
    x2="140"
    y2="48"
    stroke="#1c1c19"
    stroke-width="1.6"
    stroke-linecap="round"
  />

  <!-- 7. Gợn sóng thanh mảnh tinh tế duy nhất dưới chân núi -->
  <path
    d="M48 54 C64 56 96 56 112 54"
    stroke="#c5a059"
    stroke-width="1.1"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- 8. Typography ALPS -->
  <text
    x="80"
    y="79"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="20"
    font-weight="700"
    fill="#1c1c19"
    letter-spacing="7"
    text-anchor="middle"
  >ALPS</text>

  <!-- 9. Subtitle PURE ESSENCE -->
  <text
    x="80"
    y="95"
    font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif"
    font-size="7.5"
    font-weight="600"
    fill="#4a4742"
    letter-spacing="4.5"
    text-anchor="middle"
  >PURE ESSENCE</text>
</svg>
